# ──────────────────────────────────────────────────────────────────────────────
# Render Blueprint — CAT Backend (Docker)
# ──────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: cat-control-tower-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free

    # Health check path
    healthCheckPath: /

    # Environment variables
    # Sensitive values (TWILIO_*) must be set manually in the Render dashboard
    envVars:
      - key: PORT
        value: 10000          # Render's default internal port for Docker services
      - key: DATABASE_URL
        value: sqlite:///./cat_control_tower.db
      - key: ALLOWED_ORIGINS
        sync: false           # Set your Vercel frontend URL in Render dashboard
      - key: TWILIO_ACCOUNT_SID
        sync: false           # Set in Render dashboard — never commit real value
      - key: TWILIO_AUTH_TOKEN
        sync: false           # Set in Render dashboard — never commit real value
      - key: TWILIO_FROM_NUMBER
        sync: false           # Set in Render dashboard — never commit real value
      - key: DEFAULT_DRIVER_PHONE
        sync: false           # Set in Render dashboard — never commit real value
